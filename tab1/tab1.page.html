<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">📦 Inventory List</ion-title>
    <ion-button slot="end" color="light" (click)="showHelp()">HELP</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- 搜索框 -->
  <ion-searchbar [(ngModel)]="keyword"
                 (ionChange)="search()"
                 placeholder="Search by item name..."
                 animated
                 color="light"></ion-searchbar>

  <!-- 列表卡片式布局 -->
  <ion-list class="ion-padding-top">
    <ion-card *ngFor="let item of items" class="shadow">
      <ion-card-header color="light">
        <ion-card-title class="fw-bold">{{ item.item_name }}</ion-card-title>
        <ion-card-subtitle>ID: {{ item.item_id }} | {{ item.category }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <div class="d-flex justify-between">
          <span>💰 Price: ${{ item.price }}</span>
          <span [ngClass]="{'text-success': item.stock_status === 'In stock', 'text-danger': item.stock_status !== 'In stock'}">
            {{ item.stock_status }}
          </span>
        </div>
        <p class="text-muted mt-2">Supplier: {{ item.supplier_name }}</p>
        <ion-badge color="tertiary" *ngIf="item.featured_item === 1">Featured</ion-badge>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <!-- 空状态提示 -->
  <div *ngIf="items.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="cube-outline" size="large" color="medium"></ion-icon>
    <p class="text-muted">No items found</p>
  </div>
</ion-content>
